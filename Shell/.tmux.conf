set -g default-terminal "tmux-256color"
set -ga terminal-overrides ",*:RGB"
set -g mouse on
set -g set-clipboard on

unbind C-b
set -g prefix C-s
bind-key C-s send-prefix

# Vim like pane selection
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

unbind %
bind | split-window -h -c "#{pane_current_path}"

unbind '"'
bind \\ split-window -v -c "#{pane_current_path}"

unbind r
bind r source-file $HOME/.config/tmux/tmux.conf

# Change from 0 based to 1 based because keyboard layout
set -g base-index 1
set -g pane-base-index 1
set-window-option -g pane-base-index 1
set-option -g renumber-windows on

# Vim-like copy/paste
set-window-option -g mode-keys vi
bind-key -T copy-mode-vi v send-keys -X begin-selection
bind-key -T copy-mode-vi C-v send-keys -X rectangle-toggle
bind-key -T copy-mode-vi y send-keys -X copy-selection-and-cancel
unbind -T copy-mode-vi MouseDragEnd1Pane

# Alt+hjkl to switch panes (vim-style)
bind -n M-h select-pane -L
bind -n M-j select-pane -D
bind -n M-k select-pane -U
bind -n M-l select-pane -R

# Alt+number to select window
bind -n M-1 select-window -t 1
bind -n M-2 select-window -t 2
bind -n M-3 select-window -t 3
bind -n M-4 select-window -t 4
bind -n M-5 select-window -t 5
bind -n M-6 select-window -t 6
bind -n M-7 select-window -t 7
bind -n M-8 select-window -t 8
bind -n M-9 select-window -t 9

bind -n S-Left previous-window
bind -n S-Right next-window
# ================================================================
# Paleta de Cores - Cabin in the Woods & Turquoise Lake (Verde Floresta)
# ================================================================
thm_bg="#0c1914"        # Fundo verde-floresta escuro musgo
thm_fg="#a2d5b6"        # Texto padrão verde-névoa
thm_cyan="#34b8a5"      # Ciano reluzente do lago
thm_black="#0c1914"     # Preto/Verde profundo de fundo
thm_gray="#1b3c29"      # Verde-escuro pinheiro para painéis e seleções
thm_magenta="#237a62"   # Verde-médio para elementos secundários
thm_pink="#51dfcc"      # Tom claro ciano para destaques
thm_red="#f07124"       # Vermelho/Alaranjado do telhado para alertas
thm_green="#2bdf6d"     # Verde vibrante estilo terminal
thm_yellow="#ffffff"    # Branco puro para destaques máximos
thm_blue="#237a62"      # Tom escuro de transição para elementos inativos
thm_orange="#e2af60"    # Dourado/Amarelo quente (vegetação reluzente)
thm_black4="#1b3c29"    # Tom escuro para bordas e modos

# ================================================================
# Status Bar Settings
# ================================================================
set -g status "on"
set -g status-bg "${thm_bg}"
set -g status-justify "left"
set -g status-left-length "100"
set -g status-right-length "100"

# Messages & Commands
set -g message-style "fg=${thm_bg},bg=${thm_cyan},bold,align=centre"
set -g message-command-style "fg=${thm_bg},bg=${thm_cyan},bold,align=centre"

# Panes (Bordas divisórias)
set -g pane-border-style "fg=${thm_gray}"
set -g pane-active-border-style "fg=${thm_cyan}"

# --- Statusline Left (Sessão atual) ---
set -g status-left "#[fg=${thm_bg},bg=${thm_cyan},bold]  #S #[fg=${thm_cyan},bg=${thm_bg},nobold] "

# --- Windows (Abas ativas e inativas) ---
set -g window-status-activity-style "fg=${thm_fg},bg=${thm_bg},none"
set -g window-status-separator " "

# Janela Ativa (Pill em destaque ciano do lago)
set -g window-status-current-format "#[fg=${thm_gray},bg=${thm_bg}]#[fg=${thm_yellow},bg=${thm_gray},bold]#I #[fg=${thm_bg},bg=${thm_cyan},bold]  #(echo '#{pane_current_path}' | rev | cut -d'/' -f-1 | rev) #[fg=${thm_cyan},bg=${thm_bg}]"

# Janelas Inativas (Pill em tons verde pinheiro)
set -g window-status-format "#[fg=${thm_gray},bg=${thm_bg}]#[fg=${thm_fg},bg=${thm_gray}]#I #[fg=${thm_fg},bg=${thm_gray}]#W #[fg=${thm_gray},bg=${thm_bg}]"

# --- Statusline Right (Indicador de Prefixo + Relógio) ---
set -g status-right "#{?client_prefix,#[fg=${thm_red}]#[bg=${thm_bg}]#[fg=${thm_bg}]#[bg=${thm_red}]󰘳 PREFIX ,#[fg=${thm_gray}]#[bg=${thm_bg}]#[fg=${thm_fg}]#[bg=${thm_gray}]󰌌 NOR }#[fg=${thm_gray},bg=${thm_bg}] #[fg=${thm_bg},bg=${thm_cyan},bold] 󱑒 %H:%M #[fg=${thm_cyan},bg=${thm_gray}] 󰃭 %d/%m #[fg=${thm_gray},bg=${thm_bg}]"

# Modes
set -g clock-mode-colour "${thm_cyan}"
set -g mode-style "fg=${thm_bg},bg=${thm_cyan},bold"
